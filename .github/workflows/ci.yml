name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: Go build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  executor:
    name: Python worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: executor/requirements.txt
      - run: pip install -r executor/requirements.txt
      - run: python -m unittest discover -s executor/tests -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}
